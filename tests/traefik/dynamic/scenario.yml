# File-provider scenario for the capture harness (tests/traefik/capture.py).
#
# The basicAuth entry is the bcrypt hash of the harness-only password
# HARNESS_PASSWORD in capture.py. It protects a throwaway local container and is
# not a real credential; the capture redacts it from every fixture anyway.
#
# bulk.yml (generated by capture.py) adds 120 routers on bulk-svc so the list
# endpoints need more than one page.
http:
  routers:
    traefik-api:
      entryPoints:
        - traefik
      rule: PathPrefix(`/api`)
      service: api@internal
      middlewares:
        - api-auth

    file-ok:
      entryPoints:
        - web
      rule: Host(`app.example.com`)
      service: file-ok-svc

    # Critical error: the service does not exist, Traefik disables the router.
    broken-missing-service:
      entryPoints:
        - web
      rule: Host(`broken.example.com`)
      service: does-not-exist

    # Non-critical error: one of two entrypoints does not exist.
    warn-unknown-entrypoint:
      entryPoints:
        - web
        - does-not-exist
      rule: Host(`warn.example.com`)
      service: file-ok-svc

    # Load balancer with one healthy and one unreachable server.
    lb-router:
      entryPoints:
        - web
      rule: Host(`lb.example.com`)
      service: lb-mixed

    # TLS router with explicit domains (certificate from tls.certificates).
    secure:
      entryPoints:
        - websecure
      rule: Host(`secure.example.com`)
      service: file-ok-svc
      tls:
        domains:
          - main: secure.example.com
            sans:
              - www.secure.example.com

    # Router whose chain middleware references a missing middleware.
    chain-router:
      entryPoints:
        - web
      rule: Host(`chain.example.com`)
      service: file-ok-svc
      middlewares:
        - broken-chain

  middlewares:
    api-auth:
      basicAuth:
        users:
          - "capture:$2a$10$TCcTVgiMkhTFW4uIRwht7uIrhtWXc.SK/NF4UaMkg5qPbMwrFumzW"

    broken-chain:
      chain:
        middlewares:
          - does-not-exist-mw

  services:
    file-ok-svc:
      loadBalancer:
        servers:
          - url: http://backend.example.com:80

    lb-mixed:
      loadBalancer:
        servers:
          - url: http://backend.example.com:80
          # TEST-NET-1 (RFC 5737): never reachable, so the health check marks it DOWN.
          - url: http://192.0.2.10:80
        healthCheck:
          path: /
          interval: 2s
          timeout: 1s

    bulk-svc:
      loadBalancer:
        servers:
          - url: http://backend.example.com:80

tls:
  certificates:
    - certFile: /certs/secure.crt
      keyFile: /certs/secure.key
