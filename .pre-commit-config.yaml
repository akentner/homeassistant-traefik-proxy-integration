# Pre-commit hooks for homeassistant-traefik-proxy-integration.
#
# Mirrors the GH Actions validate.yml locally so common issues (ruff, format,
# mypy, manifest key order, JSON parse) surface before pushing. ruff and mypy
# run through `uv run`, i.e. the same tool versions as CI and the Makefile.
#
# Run without installing anything permanently:
#   make pre-commit                   # = uvx pre-commit run --all-files
# Or install ONE of:
#   uv tool install pre-commit  &&  pre-commit install
#   make install-hooks                # copies scripts/pre-commit into .git/hooks/

default_language_version:
  python: python3.14

# Planning docs are not shipped (and are rewritten by GSD tooling); captured
# fixtures must stay byte-identical.
exclude: ^(\.planning/|tests/fixtures/)

repos:
  # General repo hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        files: ^(custom_components/.*\.json|\.github/.*\.json)$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^uv\.lock$
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff (lint + format) — same version as CI via uv run
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(custom_components/traefik_proxy|tests)/

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(custom_components/traefik_proxy|tests)/

  # Mypy (strict)
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (custom_components/traefik_proxy)
        entry: uv run mypy --strict custom_components/traefik_proxy
        language: system
        files: ^custom_components/traefik_proxy/.*\.py$
        pass_filenames: false
        types: [python]

  # Hassfest-style sanity checks (no docker needed)
  - repo: local
    hooks:
      - id: hassfest-manifest-order
        name: hassfest manifest key order (domain, name, alphabetical)
        entry: uv run python scripts/hassfest_checks.py manifest-order
        language: system
        files: ^custom_components/traefik_proxy/manifest\.json$
        pass_filenames: false

      - id: hassfest-strings-shape
        name: hassfest translations/*.json shape (no top-level reauth/reconfigure, no URLs in labels)
        entry: uv run python scripts/hassfest_checks.py strings-shape
        language: system
        files: ^custom_components/traefik_proxy/translations/.*\.json$
        pass_filenames: false
